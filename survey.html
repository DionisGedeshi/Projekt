<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="survey.css">
</head>

<body>
    <header id="header">
        <h1 id="title">Survey Form</h1>
        <p id="description">This survey will help improve our website.</p>
        <hr>
    </header>

    <form id="survey-form">
        <div class="form-group">
            <label id="name-label" for="text">Name</label>
            <input type="text" placeholder="Please submit your name" id="name" required>
        </div>

        <div class="form-group">
            <label id="email-label" for="email">Email</label>
            <input type="email" placeholder="Please submit your email" id="email" required>
        </div>

        <div class="form-group">
            <label id="number-label" for="number">Age</label>
            <input type="number" placeholder="Please submit your age" id="number" required="value" min="10" max="100">
        </div>

        <div class="form-group">
            <p style="font-size: 20px;">Which of these option best describes your role?</p>
            <select id="dropdown" required>
                <option disabled selected value>Select your current role</option>
                <option>Student</option>
                <option>Teacher</option>
                <option>Rather not to say</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group" id="opinion-form">
            <p style="font-size: 20px;">Do you like the page?</p>
            <label>
                <input type="radio" name="opinion" value="yes" class="input-radio" checked>Yes</input>
            </label>
            <label>
                <input type="radio" name="opinion" value="no" class="input-radio">No</input>
            </label>
            <label>
                <input type="radio" name="opinion" value="it-can-be-better" class="input-radio">It can be better</input>
            </label>
            <label>
                <input type="radio" name="opinion" value="i-hate-it" class="input-radio">I hate it</input>
            </label>
        </div>

        <div id="improvements-list">
            <p style="font-size: 20px;">What improvements would you like to see on the page?</p>
            <label>
                <input type="checkbox" name="improvement" value="better-design" class="input-checkbox">Better design</input>
            </label>
            <label>
                <input type="checkbox" name="improvement" value="make-email-optional" class="input-checkbox">Make email optional</input>
            </label>
            <label>
                <input type="checkbox" name="improvement" value="make-age-optional" class="input-checkbox">Make age optional</input>
            </label>
            <label>
                <input type="checkbox" name="improvement" value="make-role-optional" class="input-checkbox">Make role optional</input>
            </label>
            <label>
                <input type="checkbox" name="improvement" value="bug-fixes" class="input-checkbox">Bug fixes</input>
            </label>
        </div>

        <div>
            <p style="font-size: 20px;">Any comments or suggestions?</p>
            <textarea placeholder="Enter your comment here..." id="other-recommendations" class="input-textarea" name="comment"></textarea>
        </div>

        <div>
            <button type="submit" id="submit" onclick="saveName(), saveEmail(), saveAge(), saveRole(), saveOpinion(), saveImprovements(), saveComment()">Submit</button>
        </div>
        
    </form>

    <script src="survey.js"></script>
</body>

</html>
